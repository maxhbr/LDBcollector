name: Check

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  Check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25
      - name: Downgrade to Kotlin 2.3
        env:
          GH_TOKEN: ${{ github.token }}
          KOTLIN_VERSION: 2.3.21
        run: |
          gh release download v$KOTLIN_VERSION --repo JetBrains/kotlin --pattern kotlin-compiler-$KOTLIN_VERSION.zip
          unzip -q kotlin-compiler-$KOTLIN_VERSION.zip -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Check license classifications
        run: ./scripts/check-license-classifications.main.kts

  Lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Lint YAML files
        run: yamllint license-classifications.yml

  Sort:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Sort YAML files
        run: |
          ./sort-licenses.sh
          git diff --quiet

  REUSE:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Check REUSE Compliance
        uses: fsfe/reuse-action@v6
