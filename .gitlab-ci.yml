# The Docker image that will be used to build your app
image: python:slim

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shared_data/${CI_COMMIT_TAG}"

stages:
  - build
  - upload
  - release
  - deploy

build-shared-json:
  stage: build
  image: python:3.10-alpine
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir dist
    - python to_dist.py
  artifacts:
    paths:
      - dist/shared.json

upload-shared-json:
  stage: upload
  image: curlimages/curl:latest
  needs:
    - job: build-shared-json
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/shared.json "$PACKAGE_REGISTRY_URL/shared.json"'

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: upload-shared-json
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: shared.json
          filepath: /shared.json
          url: "$PACKAGE_REGISTRY_URL/shared.json"

create-pages:
  stage: deploy
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  # Functions that should be executed before the build script is run
  before_script: []
  script:
    - python build_web_pages.py
